<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Rosa Nieve{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary-glam: #ff007f;
      --primary-glam-hover: #e0006c;
      --dark-bg: #1a1a1a;
    }
    .navbar { background-color: var(--dark-bg) !important; }
    .navbar-brand { color: var(--primary-glam) !important; letter-spacing: 1px; }
    .btn-glam { background-color: var(--primary-glam); color: white; border: none; }
    .btn-glam:hover { background-color: var(--primary-glam-hover); color: white; }
    .btn-outline-glam { border-color: var(--primary-glam); color: var(--primary-glam); }
    .btn-outline-glam:hover { background-color: var(--primary-glam); color: white; border-color: var(--primary-glam); }
    .card-img-container { height: 280px; display: flex; align-items: center; justify-content: center; background-color: #fff; overflow: hidden; padding: 10px; position: relative; }
    .img-fit { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.4s ease; }
    .card:hover .img-fit { transform: scale(1.15); }
    .card { transition: transform 0.3s ease, box-shadow 0.3s ease; border: none; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(255, 0, 127, 0.2) !important; }
    .grayscale { filter: grayscale(100%) brightness(60%); opacity: 0.9; transition: all 0.4s ease; }
    .badge-agotado { background-color: #dc3545; color: white; padding: 5px 10px; font-weight: bold; border-radius: 0 0 0 10px; }
    .card-agotada { filter: saturate(0.1); background-color: #6c757d !important; border: 2px solid #6c757d; transition: all 0.3s ease; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
    <div class="container-fluid px-4">
        
        <a class="navbar-brand fw-bold text-uppercase fs-3" href="{% url 'home' %}" style="letter-spacing: 1.5px; color: #ff69b4;">
            ROSA NIEVE
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item px-2">
                    <a class="nav-link fs-5" href="{% url 'home' %}">Inicio</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link fs-5" href="{% url 'menu' %}">Catálogo</a>
                </li>
                <li class="nav-item px-2">
                    <a class="nav-link fs-5 text-danger" href="{% url 'admin:index' %}">Admin</a>
                </li>
            </ul>

            <form class="d-flex ms-3" role="search">
                <input class="form-control form-control-md me-2" type="search" placeholder="Buscar productos..." aria-label="Search">
                <button class="btn btn-md text-white fw-bold" type="submit" style="background-color: #ff69b4;">Buscar</button>
            </form>
        </div>

    </div>
</nav>

{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.querySelector('input[name="buscar"]');
        if (!searchInput) return;

        const ultimoBusqueda = searchInput.value;

        /* Manejo del estado temporal de la consulta de búsqueda activa */
        if (ultimoBusqueda) {
            setTimeout(() => {
                searchInput.value = '';
            }, 1000);
        }

        searchInput.addEventListener('focus', function() {
            if (this.value === '' && ultimoBusqueda !== '') {
                this.value = ultimoBusqueda;
            }
        });

        searchInput.addEventListener('blur', function() {
            if (this.value === ultimoBusqueda) {
                this.value = '';
            }
        });
    });
</script>
</body>
</html>
